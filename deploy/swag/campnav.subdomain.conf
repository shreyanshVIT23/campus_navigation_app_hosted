## Version 2025/07/18
# Campus Navigation: https://campnav.shreyanshpande.work
# Copy to SWAG's /config/nginx/proxy-confs/campnav.subdomain.conf.
# SWAG and both app containers must share the external "web" network.
# The wildcard cert covers campnav.*; add a DNS record for campnav if your
# wildcard DNS record doesn't already cover it.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name campnav.*;

    include /config/nginx/ssl.conf;

    # Voice questions upload audio to /api/upload and /api/chat/audio
    client_max_body_size 20m;

    # Frontend (Next.js)
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app campus-navigation-frontend;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Backend (FastAPI): /api/<route> is forwarded as /<route>.
    # uvicorn runs with --root-path /api, so /api/docs works too.
    location /api/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app campus-navigation-backend;
        set $upstream_port 8000;
        set $upstream_proto http;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location = /api {
        return 301 /api/;
    }
}
