# Hosted behind SWAG: both containers join SWAG's external "web" network and
# publish no ports. SWAG config: deploy/swag/campnav.subdomain.conf
services:
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    image: campus-navigation-backend:local
    container_name: campus-navigation-backend
    env_file:
      - ./backend/.env
    volumes:
      # Seeded from the image's DB/ only when the volume is first created
      - campnav-db:/app/server/DB
    restart: unless-stopped
    networks: [web]
    security_opt: [no-new-privileges:true]
    labels:
      - diun.enable=false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://campnav.shreyanshpande.work/api
    image: campus-navigation-frontend:local
    container_name: campus-navigation-frontend
    restart: unless-stopped
    networks: [web]
    security_opt: [no-new-privileges:true]
    labels:
      - diun.enable=false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  campnav-db:
    name: campnav-db

networks:
  web:
    external: true
